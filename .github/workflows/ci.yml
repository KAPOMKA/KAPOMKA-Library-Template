name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    name: Host unit tests (simulated sensor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh extras/host-test/run.sh

  lint:
    name: Arduino library lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v1
        with:
          library-manager: submit
          compliance: specification

  compile:
    name: Compile examples (${{ matrix.board.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: ESP32
            fqbn: esp32:esp32:esp32
          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          cli-compile-flags: |
            - --warnings="all"
          enable-warnings-report: true
